<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>One More Fold tracker</title>
  <meta name="description" content="Your habits, folded: the month grid, goals, streaks, weekly and daily scores, and the year.">
  <!-- Link previews on X, LinkedIn, WhatsApp, Slack (D-040). The card is public/og.png (npm run og). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="One More Fold">
  <meta property="og:title" content="One More Fold tracker">
  <meta property="og:description" content="Your habits, folded: the month grid, goals, streaks, weekly and daily scores, and the year.">
  <meta property="og:url" content="https://onemorefold.com/app">
  <meta property="og:image" content="https://onemorefold.com/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="One More Fold: a paper crane under a red sun. Fall seven, rise eight. Free, no ads, no tracking.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="https://onemorefold.com/app">
  <meta name="theme-color" content="#E6E5E1">
  <script src="/theme.js"></script>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Installable, so iPhones can get reminders with the app closed (D-028). -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <link rel="stylesheet" href="/src/styles/fonts.css">
  <link rel="stylesheet" href="/src/styles/tokens.css">
  <link rel="stylesheet" href="/src/styles/paper.css">
  <link rel="stylesheet" href="/src/styles/account.css">
  <link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
  <header class="topbar">
    <a class="wordmark" href="./" title="About One More Fold"><span data-mark></span><span class="wordmark-text">onemorefold</span></a>
    <nav class="views" aria-label="Views">
      <a href="#/month" data-view="month">Month</a>
      <a href="#/year" data-view="year">Year</a>
      <a href="#/habits" data-view="habits">Habits</a>
      <a href="#/flock" data-view="flock">Flock</a>
    </nav>
    <p class="cranes-chip" data-cranes-chip></p>
    <div data-account></div>
  </header>

  <main class="canvas" id="view" tabindex="-1">
    <noscript><p>One More Fold needs JavaScript to fold anything.</p></noscript>
  </main>

  <!-- The crane lives outside the re-rendered view so its WebGL scene survives every update. -->
  <div class="crane-widget" data-stage hidden>
    <canvas aria-label="Today's crane: it folds a little more with every habit you tick" role="img"></canvas>
  </div>

  <div class="toast" role="status" aria-live="polite" data-toast></div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
